<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover" />
  <title>Mantle Social Publisher</title>
  <style>
    html, body {
      width: 100%;
      height: 100%;
      margin: 0;
      padding: 0;
      background: #08070c;
      overflow: hidden;
    }
    * { box-sizing: border-box; }
    iframe {
      display: block;
      width: 100vw;
      height: 100dvh;
      min-height: 100vh;
      border: 0;
      margin: 0;
      padding: 0;
      background: #08070c;
    }
  </style>
</head>
<body>
  <!-- Replace this URL with your Railway or production dashboard URL. -->
  <iframe
    src="https://your-railway-domain.up.railway.app"
    allow="clipboard-read; clipboard-write; fullscreen"
  ></iframe>
</body>
</html>
